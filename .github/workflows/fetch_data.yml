name: FXデータ定期収集パイプライン

on:
  schedule:
    # 毎時0分に実行 (UTC)
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # リモートとの差分・競合を防ぐため全履歴を取得
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch Market Data
        env:
          DISCORD_SYSTEM_LOG_WEBHOOK_URL: ${{ secrets.DISCORD_SYSTEM_LOG_WEBHOOK_URL }}
        run: |
          python fetch_data_main.py

      - name: Commit and push accumulated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          # 変更差分が存在する場合のみコミット＆リモート同期の上プッシュ
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update market data"
            git pull --rebase origin main
            git push origin main
          fi
