name: FXデイリーレポート作成・送信

on:
  schedule:
    # JST 23:58 (UTC 14:58) に定時実行
    - cron: '58 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 最新履歴を取得してプル時の競合を防止
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Daily Report Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_REPORT_WEBHOOK_URL: ${{ secrets.DISCORD_REPORT_WEBHOOK_URL }}
          DISCORD_SYSTEM_LOG_WEBHOOK_URL: ${{ secrets.DISCORD_SYSTEM_LOG_WEBHOOK_URL }}
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python run_daily_report.py

      - name: Commit and push cleared data and logs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          # 差分がある場合のみコミットしてリモートの最新を取得後に push
          if ! git diff-index --quiet HEAD; then
            git commit -m "Chore: Auto-update daily report record and clear data.json"
            git pull --rebase origin main
            git push origin main
          fi
