name: FX Daily Report Pipeline

on:
  schedule:
    - cron: '*/5 * * * *' # 5分おきに自動実行
  workflow_dispatch:      # 手動実行ボタン

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write     # リポジトリへの書き込み権限を付与

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main pipeline
        env:
          DISCORD_REPORT_WEBHOOK_URL: ${{ secrets.DISCORD_REPORT_WEBHOOK_URL }}
          DISCORD_LOG_WEBHOOK_URL: ${{ secrets.DISCORD_LOG_WEBHOOK_URL }}
        run: |
          python main.py

      # 生成・追記された data/ ディレクトリをリポジトリに Commit & Push
      - name: Commit and push updated data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          
          # 価格変化がなく diff が空の場合でもエラー終了せず、確実に追記データをコミット＆Push
          if git commit -m "chore: auto-update market data [skip ci]"; then
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit. Proceeding normally."
          fi
