name: FXデイリーレポート作成・送信

on:
  # cron-job.org 等の外部トリガーと重複起爆するのを防ぐため、内蔵 schedule はオフに設定
  # schedule:
  #   - cron: '58 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Daily Report Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_REPORT_WEBHOOK_URL: ${{ secrets.DISCORD_REPORT_WEBHOOK_URL }}
          DISCORD_SYSTEM_LOG_WEBHOOK_URL: ${{ secrets.DISCORD_SYSTEM_LOG_WEBHOOK_URL }}
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python run_daily_report.py

      - name: Commit and push cleared data and logs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          # [skip ci] を付与して Push 後の別ワークフロー連鎖起動（再起動ループ）を完全防止
          if ! git diff-index --quiet HEAD; then
            git commit -m "Chore: Auto-update daily report record and clear data.json [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
